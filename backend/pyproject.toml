[project]
name = "mirofish-backend"
version = "0.1.0"
description = "MiroFish - 简洁通用的群体智能引擎，预测万物"
requires-python = ">=3.11,<3.12"
license = { text = "AGPL-3.0" }
authors = [
    { name = "MiroFish Team" }
]

dependencies = [
    # 核心框架
    "flask>=3.0.0",
    "flask-cors>=6.0.0",
    
    # LLM 相关
    "openai>=1.0.0",
    
    # Zep Cloud
    "zep-cloud==3.25.0",
    "httpx>=0.27.0",
    
    # OASIS 社交媒体模拟
    "camel-oasis==0.2.5",
    "camel-ai==0.2.78",
    
    # 文件处理
    "PyMuPDF>=1.24.0",
    # 编码检测（支持非UTF-8编码的文本文件）
    "charset-normalizer>=3.0.0",
    "chardet>=5.0.0",
    
    # 工具库
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
cloud-gpu = ["torch==2.9.1"]
local = [
    "graphiti-core==0.30.2",
    "torch==2.9.1",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pipreqs>=0.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

# OASIS pins an older driver for its optional Neo4j agent-graph path. MiroFish
# uses igraph there; Graphiti requires >=5.26. Tested against the 5.x driver API.
# Use uv for local installs; pip cannot express this transitive override.
[tool.uv]
conflicts = [[{ extra = "local" }, { extra = "cloud-gpu" }]]
override-dependencies = ["neo4j==5.28.3"]

# The local extra keeps OASIS on CPU. Ollama/llama.cpp owns GPU inference.
[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "local", marker = "sys_platform != 'darwin'" },
    { index = "pypi", extra = "cloud-gpu" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true
