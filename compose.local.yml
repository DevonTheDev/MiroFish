# Single-user local memory only. Never expose this unauthenticated DB to a LAN.
# Start: docker compose -f compose.local.yml up -d
services:
  neo4j:
    image: neo4j:5.26.31-community
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    environment:
      NEO4J_AUTH: none
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
      NEO4J_dbms_usage__report_enabled: "false"
    volumes:
      - mirofish-local-graph:/data
    healthcheck:
      test: ["CMD", "cypher-shell", "RETURN 1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 30s
volumes:
  mirofish-local-graph:
