name: Local-mode verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: local-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Offline backend and local memory
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHON_DOTENV_DISABLED: "1"
      MIRO_TEST_NEO4J_URI: bolt://127.0.0.1:7687
      GRAPHITI_TELEMETRY_ENABLED: "false"
      UV_LINK_MODE: copy
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install uv and Python
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.19"
          python-version: "3.11"
          working-directory: backend
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install the locked CPU-only local extra
        run: uv sync --project backend --extra local --locked
      - name: Start disposable loopback graph database
        run: docker compose -p mirofish-ci -f compose.local.yml up -d --wait --wait-timeout 180
      - name: Run complete suite with Python network guard
        run: uv run --project backend --extra local --locked python backend/scripts/run_offline_tests.py --require-neo4j -q
      - name: Check Python compilation
        run: uv run --project backend --extra local --locked python -m compileall -q backend/app backend/scripts backend/tests
      - name: Stop test graph database
        if: always()
        run: docker compose -p mirofish-ci -f compose.local.yml down

  frontend:
    name: Frontend tests and production build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend dependencies
        run: npm ci --ignore-scripts --prefix frontend
      - name: Test frontend content rendering
        run: npm test --prefix frontend
      - name: Build frontend
        run: npm run build --prefix frontend
